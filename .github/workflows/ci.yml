name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Java dosyalarını derle
        # src içindeki tüm dosyaları derlemek için yolu belirttik
        run: javac src/com/example/notification/*.java

      - name: Programı çalıştır
        # Paket isminle beraber çalıştırıyoruz
        run: java -cp src com.example.notification.Main
