name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Java dosyalarını derle
        # -sourcepath kullanarak paket yapısını Java'ya tanıtıyoruz
        run: javac -sourcepath src -d out src/com/example/notification/*.java

      - name: Programı çalıştır
        # Derlenen dosyaları 'out' klasöründen paket ismiyle çağırıyoruz
        run: java -cp out com.example.notification.Main
